# Development: from repo root run `docker compose up --build`
# Copy `.env.example` to `.env` and set values before build/up.
# Source is bind-mounted; Vite/nodemon watch reload on changes. node_modules/vendor live in named volumes.
# meet-mediaserver uses bridge network with published ports; frontend/recorder reach it as meet-mediaserver:3001.
name: avnik-dev

x-mysql-env: &mysql_env
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  MYSQL_DATABASE: ${MYSQL_DATABASE}
  MYSQL_USER: ${MYSQL_USER}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}

x-db-connection: &db_connection
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${MYSQL_DATABASE}
  DB_USER: ${MYSQL_USER}
  DB_PASSWORD: ${MYSQL_PASSWORD}

x-admin-backend-env: &admin_backend_env
  NODE_ENV: development
  PORT: ${ADMIN_BACKEND_PORT}
  JWT_SECRET: ${JWT_SECRET}
  SKIP_DB_SYNC: ${SKIP_DB_SYNC}
  CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING}
  STRIPE_SECRET: ${STRIPE_SECRET}
  <<: *db_connection

x-laravel-env: &laravel_env
  APP_NAME: ${APP_NAME}
  APP_ENV: ${APP_ENV}
  APP_KEY: ${APP_KEY}
  APP_DEBUG: ${APP_DEBUG}
  APP_URL: ${LARAVEL_APP_URL}
  LOG_CHANNEL: stack
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${MYSQL_DATABASE}
  DB_USERNAME: ${MYSQL_USER}
  DB_PASSWORD: ${MYSQL_PASSWORD}
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync
  SKIP_MIGRATIONS: ${SKIP_MIGRATIONS}
  NPM_CONFIG_LEGACY_PEER_DEPS: ${NPM_CONFIG_LEGACY_PEER_DEPS}
  FORCE_HTTPS: ${FORCE_HTTPS}
  STRIPE_KEY: ${STRIPE_KEY}
  STRIPE_SECRET: ${STRIPE_SECRET}

x-admin-frontend-env: &admin_frontend_env
  NPM_CONFIG_LEGACY_PEER_DEPS: ${NPM_CONFIG_LEGACY_PEER_DEPS}
  VITE_DEV_PROXY_TARGET: ${VITE_DEV_PROXY_TARGET}
  CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING}
  VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH}
  VITE_API_BASE_URL: ${FRONTEND_VITE_API_BASE_URL}
  VITE_IMAGE_BASE_URL: ${FRONTEND_VITE_IMAGE_BASE_URL}
  VITE_MEETING_FRONT_URL: ${FRONTEND_VITE_MEETING_FRONT_URL}
  VITE_MEETING_API_URL: ${FRONTEND_VITE_MEETING_API_URL}

x-postgres-env: &postgres_env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}

x-meet-backend-env: &meet_backend_env
  NODE_ENV: development
  PORT: ${BACKEND_PORT}
  MEDIA_JWT_SECRET: ${BACKEND_MEDIA_JWT_SECRET}
  MEDIA_JWT_TTL_SEC: ${BACKEND_MEDIA_JWT_TTL_SEC}
  CORS_ORIGIN: ${BACKEND_CORS_ORIGIN}
  CHOKIDAR_USEPOLLING: "true"
  REDIS_URL: ${BACKEND_REDIS_URL}
  DATABASE_URL: ${BACKEND_DATABASE_URL}
  DATABASE_SYNC: ${BACKEND_DATABASE_SYNC}
  DATABASE_LOGGING: ${BACKEND_DATABASE_LOGGING}
  MEETING_REDIRECT_URL: ${BACKEND_MEETING_REDIRECT_URL}
  UPLOAD_DIR: /app/uploads
  API_PREFIX: ${BACKEND_API_PREFIX}
  RECORDER_SERVICE_URL: ${BACKEND_RECORDER_SERVICE_URL}

x-meet-mediaserver-env: &meet_mediaserver_env
  MEDIA_JWT_SECRET: ${MEDIASERVER_MEDIA_JWT_SECRET}
  NODE_ENV: development
  PORT: ${MEDIASERVER_PORT}
  LOG_LEVEL: ${MEDIASERVER_LOG_LEVEL}
  MEDIASOUP_ANNOUNCED_IP: ${MEDIASERVER_ANNOUNCED_IP}
  MEDIASOUP_RTC_MIN_PORT: ${MEDIASERVER_RTC_MIN_PORT}
  MEDIASOUP_RTC_MAX_PORT: ${MEDIASERVER_RTC_MAX_PORT}
  TURN_URLS: ${MEDIASERVER_TURN_URLS}
  TURN_USERNAME: ${MEDIASERVER_TURN_USERNAME}
  TURN_PASSWORD: ${MEDIASERVER_TURN_PASSWORD}
  CHOKIDAR_USEPOLLING: "true"

x-meet-frontend-env: &meet_frontend_env
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"
  VITE_BIND_ALL: "1"
  CHOKIDAR_USEPOLLING: "true"
  VITE_DEV_PROXY_TARGET: http://meet-backend:${BACKEND_PORT}
  VITE_MEDIA_PROXY_TARGET: http://meet-mediaserver:${MEDIASERVER_PORT}
  VITE_MEETING_REDIRECT_URL: ${FRONTEND_VITE_MEETING_REDIRECT_URL}

x-meet-recorder-env: &meet_recorder_env
  NODE_ENV: development
  PORT: ${RECORDER_PORT}
  STORAGE_DIR: /app/storage
  FRONTEND_URL: ${RECORDER_FRONTEND_URL}
  MEETING_API_URL: ${RECORDER_MEETING_API_URL}
  RECORDER_PUBLIC_URL: ${RECORDER_PUBLIC_URL}
  MEDIA_PUBLIC_WS_URL: ${RECORDER_MEDIA_PUBLIC_WS_URL}
  CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
  DBUS_SESSION_BUS_ADDRESS: "disabled:"
  CHUNK_INTERVAL_MS: ${RECORDER_CHUNK_INTERVAL_MS}
  READY_TIMEOUT_MS: ${RECORDER_READY_TIMEOUT_MS}
  STOP_GRACE_MS: ${RECORDER_STOP_GRACE_MS}
  MAX_PARALLEL_RECORDINGS: ${RECORDER_MAX_PARALLEL_RECORDINGS}
  CHOKIDAR_USEPOLLING: "true"

services:
  mysql:
    image: mysql:8.0
    container_name: avnik-mysql-dev
    ports:
      - "${MYSQL_PUBLISHED_PORT}:3306"
    environment:
      <<: *mysql_env
    volumes:
      - avnik_mysql_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: avnik-phpmyadmin-dev
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  admin-backend:
    build:
      context: ./avnik-admin-backend
      dockerfile: ${ADMIN_BACKEND_DOCKERFILE}
    container_name: avnik-admin-backend-dev
    working_dir: /app
    volumes:
      - ./avnik-admin-backend:/app
      - avnik_admin_backend_node_modules:/app/node_modules
      - avnik_admin_backend_uploads:/app/app/uploads
    ports:
      - "${ADMIN_BACKEND_PORT}:${ADMIN_BACKEND_PORT}"
    environment:
      <<: *admin_backend_env
    depends_on:
      mysql:
        condition: service_healthy

  laravel-backend:
    build:
      context: ./avnik-admin-laravel-backend
      dockerfile: ${LARAVEL_DOCKERFILE}
    container_name: avnik-laravel-backend-dev
    working_dir: /app
    volumes:
      - ./avnik-admin-laravel-backend:/app
      - avnik_laravel_vendor:/app/vendor
      - avnik_laravel_node_modules:/app/node_modules
      - avnik_laravel_uploads:/app/uploads
    ports:
      - "${LARAVEL_BACKEND_PORT}:8000"
    environment:
      <<: *laravel_env
    depends_on:
      mysql:
        condition: service_healthy

  admin-frontend:
    build:
      context: ./avnik-admin-frontend
      dockerfile: ${ADMIN_FRONTEND_DOCKERFILE}
    container_name: avnik-admin-frontend-dev
    working_dir: /app
    volumes:
      - ./avnik-admin-frontend:/app
      - avnik_admin_frontend_node_modules:/app/node_modules
    ports:
      - "${ADMIN_FRONTEND_PORT}:3000"
    environment:
      <<: *admin_frontend_env
    depends_on:
      - admin-backend
      - laravel-backend

  postgres:
    image: postgres:16-alpine
    container_name: avnik-postgres-dev
    ports:
      - "5432:5432"
    environment:
      <<: *postgres_env
    volumes:
      - avnik_postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: avnik-redis-dev
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - avnik_redis_data_dev:/data

  meet-backend:
    build:
      context: ./meet-backend
      dockerfile: Dockerfile.local
    container_name: avnik-meet-backend-dev
    working_dir: /app
    volumes:
      - ./meet-backend:/app
      - avnik_meet_backend_node_modules:/app/node_modules
      - avnik_meet_uploads_data_dev:/app/uploads
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      <<: *meet_backend_env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  meet-mediaserver:
    build:
      context: ./meet-mediaserver
      dockerfile: Dockerfile.local
    container_name: avnik-meet-mediaserver-dev
    working_dir: /app
    volumes:
      - ./meet-mediaserver:/app
      - avnik_meet_mediaserver_node_modules:/app/node_modules
    ports:
      - "${MEDIASERVER_PORT}:${MEDIASERVER_PORT}/tcp"
      - "${MEDIASERVER_RTC_MIN_PORT}-${MEDIASERVER_RTC_MAX_PORT}:${MEDIASERVER_RTC_MIN_PORT}-${MEDIASERVER_RTC_MAX_PORT}/udp"
    environment:
      <<: *meet_mediaserver_env

  meet-frontend:
    build:
      context: ./meet-frontend
      dockerfile: Dockerfile.local
    container_name: avnik-meet-frontend-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /app
    volumes:
      - ./meet-frontend:/app
      - avnik_meet_frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_HTTP_PORT}:5173"
    environment:
      <<: *meet_frontend_env
    depends_on:
      - meet-backend
      - meet-mediaserver

  meet-recorder:
    build:
      context: ./meet-recorder
      dockerfile: Dockerfile.local
    container_name: avnik-meet-recorder-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /app
    volumes:
      - ./meet-recorder:/app
      - avnik_meet_recorder_node_modules:/app/node_modules
      - avnik_meet_recorder_storage_dev:/app/storage
    ports:
      - "${RECORDER_PORT}:${RECORDER_PORT}"
    environment:
      <<: *meet_recorder_env
    depends_on:
      - proxy
      - meet-frontend
      - meet-backend
      - meet-mediaserver
    shm_size: "1gb"

  # Edge router (HTTP only). Host nginx can forward here in local/staging setups.
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: avnik-proxy-dev
    ports:
      - "${PROXY_PORT}:7000"
    volumes:
      - ./proxy/routes.dev.conf:/etc/nginx/conf.d/default.conf:ro
      # Read-only media volumes — nginx serves /static/* without Node streaming
      - avnik_meet_uploads_data_dev:/var/www/meet-uploads:ro
      - avnik_meet_recorder_storage_dev:/var/www/meet-recorder-storage:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - laravel-backend
      - admin-frontend
      - admin-backend
      - meet-frontend
      - meet-backend
      - meet-mediaserver
      - phpmyadmin

volumes:
  avnik_mysql_data_dev:
  avnik_admin_backend_node_modules:
  avnik_admin_backend_uploads:
  avnik_admin_frontend_node_modules:
  avnik_laravel_vendor:
  avnik_laravel_node_modules:
  avnik_laravel_uploads:
  avnik_postgres_data_dev:
  avnik_redis_data_dev:
  avnik_meet_uploads_data_dev:
  avnik_meet_recorder_storage_dev:
  avnik_meet_backend_node_modules:
  avnik_meet_frontend_node_modules:
  avnik_meet_mediaserver_node_modules:
  avnik_meet_recorder_node_modules:
