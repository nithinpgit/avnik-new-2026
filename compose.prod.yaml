# Production: `docker compose -f compose.prod.yaml up --build`
#
# meet-mediaserver uses network_mode: host (signaling + RTC bind on the host).
#
# Copy `.env.example` to `.env` and set every value before build/up.

name: avnik-prod

x-mysql-env: &mysql_env
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  MYSQL_DATABASE: ${MYSQL_DATABASE}
  MYSQL_USER: ${MYSQL_USER}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}

x-db-connection: &db_connection
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${MYSQL_DATABASE}
  DB_USER: ${MYSQL_USER}
  DB_PASSWORD: ${MYSQL_PASSWORD}

x-admin-backend-env: &admin_backend_env
  NODE_ENV: production
  PORT: ${ADMIN_BACKEND_PORT}
  JWT_SECRET: ${JWT_SECRET}
  SKIP_DB_SYNC: "true"
  STRIPE_SECRET: ${STRIPE_SECRET}
  <<: *db_connection

x-laravel-env: &laravel_env
  APP_NAME: ${APP_NAME}
  APP_ENV: production
  APP_KEY: ${APP_KEY}
  APP_DEBUG: "false"
  APP_URL: ${LARAVEL_APP_URL}
  LOG_CHANNEL: stack
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${MYSQL_DATABASE}
  DB_USERNAME: ${MYSQL_USER}
  DB_PASSWORD: ${MYSQL_PASSWORD}
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync
  FORCE_HTTPS: ${FORCE_HTTPS}
  SKIP_MIGRATIONS: ${SKIP_MIGRATIONS}
  STRIPE_KEY: ${STRIPE_KEY}
  STRIPE_SECRET: ${STRIPE_SECRET}

x-admin-frontend-build: &admin_frontend_build
  VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH}
  VITE_API_BASE_URL: ${FRONTEND_VITE_API_BASE_URL}
  VITE_IMAGE_BASE_URL: ${FRONTEND_VITE_IMAGE_BASE_URL}
  VITE_MEETING_FRONT_URL: ${FRONTEND_VITE_MEETING_FRONT_URL}
  VITE_MEETING_API_URL: ${FRONTEND_VITE_MEETING_API_URL}

x-postgres-env: &postgres_env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}

x-meet-backend-env: &meet_backend_env
  NODE_ENV: production
  PORT: ${BACKEND_PORT}
  DATABASE_URL: ${BACKEND_DATABASE_URL}
  REDIS_URL: ${BACKEND_REDIS_URL}
  MEDIA_JWT_SECRET: ${BACKEND_MEDIA_JWT_SECRET}
  MEDIA_JWT_TTL_SEC: ${BACKEND_MEDIA_JWT_TTL_SEC}
  CORS_ORIGIN: ${BACKEND_CORS_ORIGIN}
  MEETING_REDIRECT_URL: ${BACKEND_MEETING_REDIRECT_URL}
  DATABASE_SYNC: ${BACKEND_DATABASE_SYNC}
  DATABASE_LOGGING: ${BACKEND_DATABASE_LOGGING}
  UPLOAD_DIR: /app/uploads
  API_PREFIX: ${BACKEND_API_PREFIX}
  RECORDER_SERVICE_URL: ${BACKEND_RECORDER_SERVICE_URL}

x-meet-mediaserver-env: &meet_mediaserver_env
  NODE_ENV: production
  PORT: ${MEDIASERVER_PORT}
  MEDIA_JWT_SECRET: ${MEDIASERVER_MEDIA_JWT_SECRET}
  LOG_LEVEL: ${MEDIASERVER_LOG_LEVEL}
  MEDIASOUP_ANNOUNCED_IP: ${MEDIASERVER_ANNOUNCED_IP}
  MEDIASOUP_RTC_MIN_PORT: ${MEDIASERVER_RTC_MIN_PORT}
  MEDIASOUP_RTC_MAX_PORT: ${MEDIASERVER_RTC_MAX_PORT}
  TURN_URLS: ${MEDIASERVER_TURN_URLS}
  TURN_USERNAME: ${MEDIASERVER_TURN_USERNAME}
  TURN_PASSWORD: ${MEDIASERVER_TURN_PASSWORD}

x-meet-recorder-env: &meet_recorder_env
  NODE_ENV: production
  PORT: ${RECORDER_PORT}
  STORAGE_DIR: /app/storage
  FRONTEND_URL: ${RECORDER_FRONTEND_URL}
  MEETING_API_URL: ${RECORDER_MEETING_API_URL}
  RECORDER_PUBLIC_URL: ${RECORDER_PUBLIC_URL}
  MEDIA_PUBLIC_WS_URL: ${RECORDER_MEDIA_PUBLIC_WS_URL}
  CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
  DBUS_SESSION_BUS_ADDRESS: "disabled:"
  CHUNK_INTERVAL_MS: ${RECORDER_CHUNK_INTERVAL_MS}
  READY_TIMEOUT_MS: ${RECORDER_READY_TIMEOUT_MS}
  STOP_GRACE_MS: ${RECORDER_STOP_GRACE_MS}
  MAX_PARALLEL_RECORDINGS: ${RECORDER_MAX_PARALLEL_RECORDINGS}

x-meet-frontend-build: &meet_frontend_build
  VITE_MEETING_REDIRECT_URL: ${FRONTEND_VITE_MEETING_REDIRECT_URL}
  VITE_TURN_URLS: ${MEDIASERVER_TURN_URLS}
  VITE_TURN_USERNAME: ${MEDIASERVER_TURN_USERNAME}
  VITE_TURN_PASSWORD: ${MEDIASERVER_TURN_PASSWORD}

services:
  mysql:
    image: mysql:8.0
    container_name: avnik-mysql-prod
    environment:
      <<: *mysql_env
    volumes:
      - avnik_mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: avnik-phpmyadmin-prod
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      # Use MySQL root so phpMyAdmin can create/drop databases and manage all schemas.
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  admin-backend:
    build:
      context: ./avnik-admin-backend
      dockerfile: Dockerfile
    container_name: avnik-admin-backend-prod
    environment:
      <<: *admin_backend_env
    volumes:
      - avnik_admin_backend_uploads_prod:/app/app/uploads
    ports:
      - "${ADMIN_BACKEND_PORT}:${ADMIN_BACKEND_PORT}"
    depends_on:
      mysql:
        condition: service_healthy

  laravel-backend:
    build:
      context: ./avnik-admin-laravel-backend
      dockerfile: Dockerfile
    container_name: avnik-laravel-backend-prod
    environment:
      <<: *laravel_env
    volumes:
      - avnik_laravel_storage_prod:/app/storage
      - avnik_laravel_uploads_prod:/app/uploads
    ports:
      - "${LARAVEL_BACKEND_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy

  admin-frontend:
    build:
      context: ./avnik-admin-frontend
      dockerfile: Dockerfile
      args:
        <<: *admin_frontend_build
    container_name: avnik-admin-frontend-prod
    ports:
      - "${ADMIN_FRONTEND_HTTP_PORT}:80"
    depends_on:
      - admin-backend
      - laravel-backend

  postgres:
    image: postgres:16-alpine
    container_name: avnik-postgres-prod
    environment:
      <<: *postgres_env
    volumes:
      - avnik_postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: avnik-redis-prod
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - avnik_redis_data_prod:/data

  meet-backend:
    build:
      context: ./meet-backend
      dockerfile: Dockerfile
    container_name: avnik-meet-backend-prod
    environment:
      <<: *meet_backend_env
    volumes:
      - avnik_meet_uploads_data_prod:/app/uploads
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  meet-mediaserver:
    build:
      context: ./meet-mediaserver
      dockerfile: Dockerfile
    container_name: avnik-meet-mediaserver-prod
    network_mode: host
    environment:
      <<: *meet_mediaserver_env
    depends_on:
      - meet-backend

  meet-frontend:
    build:
      context: ./meet-frontend
      dockerfile: Dockerfile
      args:
        <<: *meet_frontend_build
    container_name: avnik-meet-frontend-prod
    ports:
      - "${FRONTEND_HTTP_PORT}:80"
    depends_on:
      - meet-backend
      - meet-mediaserver

  meet-recorder:
    build:
      context: ./meet-recorder
      dockerfile: Dockerfile
    container_name: avnik-meet-recorder-prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *meet_recorder_env
    volumes:
      - avnik_meet_recorder_storage_prod:/app/storage
    ports:
      - "127.0.0.1:${RECORDER_PORT}:${RECORDER_PORT}/tcp"
    depends_on:
      - proxy
      - meet-frontend
      - meet-backend
      - meet-mediaserver
    shm_size: "1gb"

  # Edge router (HTTP only). Host nginx terminates TLS and proxies to PROXY_PORT.
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: avnik-proxy-prod
    ports:
      - "${PROXY_PORT}:7000"
    volumes:
      # Read-only media volumes — nginx serves /static/* without Node streaming
      - avnik_meet_uploads_data_prod:/var/www/meet-uploads:ro
      - avnik_meet_recorder_storage_prod:/var/www/meet-recorder-storage:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - laravel-backend
      - admin-frontend
      - admin-backend
      - meet-frontend
      - meet-backend
      - phpmyadmin

volumes:
  avnik_mysql_data_prod:
  avnik_admin_backend_uploads_prod:
  avnik_laravel_storage_prod:
  avnik_laravel_uploads_prod:
  avnik_postgres_data_prod:
  avnik_redis_data_prod:
  avnik_meet_uploads_data_prod:
  avnik_meet_recorder_storage_prod:
