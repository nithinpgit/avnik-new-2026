# Avnik internal edge proxy — DEV (compose.yaml).
# Upstream ports match bind-mounted Vite / artisan containers (not prod nginx :80).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keep HTTPS when host nginx already set X-Forwarded-Proto (TLS → HTTP proxy hop).
map $http_x_forwarded_proto $avnik_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Prefer client Host from TLS terminator when present.
map $http_x_forwarded_host $avnik_forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

server {
    listen 7000;
    server_name _;

    client_max_body_size 100m;

    # -------------------------------------------------------------------------
    # phpMyAdmin → phpmyadmin:80
    # -------------------------------------------------------------------------
    location = /myadmin {
        return 301 /myadmin/;
    }

    location /myadmin/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $avnik_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $avnik_forwarded_host;
        proxy_set_header X-Forwarded-Proto $avnik_forwarded_proto;
    }

    # -------------------------------------------------------------------------
    # Meet frontend (Vite :5173)
    # -------------------------------------------------------------------------
    location ~* ^/join/.*\.mjs$ {
        proxy_pass http://meet-frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $avnik_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $avnik_forwarded_host;
        proxy_set_header X-Forwarded-Proto $avnik_forwarded_proto;
        proxy_hide_header Content-Type;
        add_header Content-Type "application/javascript" always;
    }

    location /join/ {
        proxy_pass http://meet-frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $avnik_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $avnik_forwarded_host;
        proxy_set_header X-Forwarded-Proto $avnik_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # -------------------------------------------------------------------------
    # React admin (Vite :3000)
    # -------------------------------------------------------------------------
    location ~* ^/admin/.*\.mjs$ {
        proxy_pass http://admin-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $avnik_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $avnik_forwarded_host;
        proxy_set_header X-Forwarded-Proto $avnik_forwarded_proto;
        proxy_hide_header Content-Type;
        add_header Content-Type "application/javascript" always;
    }

    location /admin/ {
        proxy_pass http://admin-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $avnik_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $avnik_forwarded_host;
        proxy_set_header X-Forwarded-Proto $avnik_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # -------------------------------------------------------------------------
    # Express admin API → admin-backend:8001
    # -------------------------------------------------------------------------
    location /adminapis {
        proxy_pass http://admin-backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $avnik_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $avnik_forwarded_host;
        proxy_set_header X-Forwarded-Proto $avnik_forwarded_proto;
    }

    # -------------------------------------------------------------------------
    # Meet media — serve files/recordings directly from disk (not Node streaming)
    # Volumes: meet-uploads → /var/www/meet-uploads
    #          meet-recorder-storage → /var/www/meet-recorder-storage
    # -------------------------------------------------------------------------
    location /static/files/ {
        alias /var/www/meet-uploads/;
        autoindex off;
        disable_symlinks on;
        add_header Accept-Ranges bytes always;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # Extensionless: /static/recordings/{uuid} → try .webm then .mp4
    # Note: \{36\} — braces must be escaped or nginx treats them as variables.
    location ~ "^/static/recordings/([-0-9a-fA-F]{36})/?$" {
        set $rid $1;
        root /var/www/meet-recorder-storage;
        try_files /recordings/$rid/$rid.webm /recordings/$rid/$rid.mp4 =404;
        autoindex off;
        disable_symlinks on;
        add_header Accept-Ranges bytes always;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    location /static/recordings/ {
        alias /var/www/meet-recorder-storage/recordings/;
        autoindex off;
        disable_symlinks on;
        add_header Accept-Ranges bytes always;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # Legacy Nest static prefix — same upload volume
    location /uploads/ {
        alias /var/www/meet-uploads/;
        autoindex off;
        disable_symlinks on;
        add_header Accept-Ranges bytes always;
    }

    # -------------------------------------------------------------------------
    # Nest meet API → meet-backend:3000
    # -------------------------------------------------------------------------
    location /meet/api/ {
        proxy_pass http://meet-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $avnik_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $avnik_forwarded_host;
        proxy_set_header X-Forwarded-Proto $avnik_forwarded_proto;
        proxy_redirect off;
    }

    # -------------------------------------------------------------------------
    # WebSockets
    # -------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://meet-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $avnik_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $avnik_forwarded_host;
        proxy_set_header X-Forwarded-Proto $avnik_forwarded_proto;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Dev mediaserver is on the compose network (not host mode)
    location /mediasoup-socket.io/ {
        proxy_pass http://meet-mediaserver:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $avnik_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $avnik_forwarded_host;
        proxy_set_header X-Forwarded-Proto $avnik_forwarded_proto;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # Laravel platform (artisan serve :8000)
    # -------------------------------------------------------------------------
    location ~* \.mjs$ {
        proxy_pass http://laravel-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $avnik_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $avnik_forwarded_host;
        proxy_set_header X-Forwarded-Proto $avnik_forwarded_proto;
        proxy_hide_header Content-Type;
        add_header Content-Type "application/javascript" always;
    }

    location / {
        proxy_pass http://laravel-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $avnik_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $avnik_forwarded_host;
        proxy_set_header X-Forwarded-Proto $avnik_forwarded_proto;
    }
}
