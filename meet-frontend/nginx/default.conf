# Meet frontend — static React SPA only (no API / WebSocket proxies).
# Edge routing lives in the `proxy` service (proxy/routes.conf).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # pdf.js worker (Vite emits *.mjs) — default nginx mime.types omits .mjs
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    location = /join {
        return 301 /join/$is_args$args;
    }

    location /join/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /join/index.html;
    }

    location / {
        return 404;
    }
}
