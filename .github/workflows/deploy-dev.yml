name: Deploy (dev)

# Auto-deploy to the Ubuntu server whenever code is pushed to the dev branch.
on:
  push:
    branches:
      - dev
  # Lets you trigger a deploy manually from the GitHub Actions tab too.
  workflow_dispatch:

# Prevent overlapping deploys; if a new push comes in, cancel the older run.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH build & deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Fail the job if any command in the script fails.
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.PROJECT_PATH }}"

            echo "==> Ensuring we are on the dev branch"
            git checkout dev

            echo "==> Pulling latest code"
            git fetch origin dev
            git reset --hard origin/dev

            echo "==> Building and deploying with docker compose"
            docker compose -f compose.prod.yaml up -d --build

            echo "==> Cleaning up dangling images"
            docker image prune -f

            echo "==> Deployment finished"
            docker compose -f compose.prod.yaml ps
